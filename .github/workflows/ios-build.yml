name: iOS Build
run-name: iOS Build ${{ inputs.build_id || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build identifier"
        required: true
        type: string
      configuration:
        description: "Build configuration (Debug is faster, Release for production)"
        required: false
        type: choice
        options:
          - Release
          - Debug
        default: "Release"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Export JS Bundle
        run: npx expo export --platform ios

      - name: Build iOS App with Xcode
        run: |
          XCODE_SCHEME=$(xcodebuild -workspace ios/*.xcworkspace -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          xcodebuild -workspace ios/*.xcworkspace -scheme "$XCODE_SCHEME" -configuration ${{ inputs.configuration }} -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build/Build/Products/${{ inputs.configuration }}-iphoneos/*.app Payload/
          zip -r Gym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gym-${{ inputs.build_id }}-${{ inputs.configuration }}
          path: Gym.ipa
